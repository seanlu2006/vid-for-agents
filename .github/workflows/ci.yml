name: Shell checks

on:
  push:
  pull_request:

jobs:
  shell:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        # 測試需要真的 ffmpeg；runner 映像不保證有，沒有才裝
        run: |
          command -v shellcheck >/dev/null || brew install shellcheck
          command -v ffmpeg >/dev/null || brew install ffmpeg
          command -v opencc >/dev/null || brew install opencc
      - name: ShellCheck
        run: shellcheck vid install.sh tests/test_vid.sh
      - name: Shell tests
        # macOS runner 一定要跑到 OCR 測試，缺 swiftc 就算失敗
        env:
          VID_REQUIRE_OCR: "1"
        run: tests/test_vid.sh
